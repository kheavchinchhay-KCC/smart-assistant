project_id = "smart-assistant"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "vault"]

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = false
# Supabase Auth (email/password/OAuth) is intentionally disabled — this
# project authenticates exclusively via Telegram. See README "Security
# Model" and migration 0001_extensions_and_helpers.sql for the full
# rationale. The web API now verifies its own application session token;
# RLS remains enabled as defense in depth for any future user-scoped client.

[edge_runtime]
enabled = true

[functions.api]
verify_jwt = false

[functions.auth-telegram-miniapp]
verify_jwt = false

[functions.telegram-webhook]
verify_jwt = false
