project_id = "smart-assistant"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "vault"]

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = false
# Supabase Auth (email/password/OAuth) is intentionally disabled — this
# project authenticates exclusively via Telegram. See README "Security
# Model" and migration 0001_extensions_and_helpers.sql for the full
# rationale. RLS still applies, keyed off a custom-signed JWT rather
# than auth.users.

[edge_runtime]
enabled = true

# The Telegram webhook is authenticated in application code using
# TELEGRAM_WEBHOOK_SECRET, not a Supabase user JWT.
[functions.telegram-webhook]
verify_jwt = false

# The frontend API uses the app's own signed session JWT (APP_SESSION_SECRET),
# not a Supabase Auth JWT, so the Supabase gateway must not enforce its JWT check.
[functions.api]
verify_jwt = false

# The Mini App auth endpoint receives Telegram WebApp initData and performs
# its own Telegram signature validation before issuing the app session token.
[functions.auth-telegram-miniapp]
verify_jwt = false
